<!DOCTYPE html>
<html lang="wo">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Yaatal Sold Out</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:transparent;font-family:"Segoe UI",Arial,sans-serif;overflow:hidden;height:100vh;display:grid;place-items:center}.sold-out{background:#d93131;color:#fff;padding:19px 54px;border:3px solid #fff;border-radius:8px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);transform:rotate(-8deg) scale(.8);opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s}.sold-out.visible{visibility:visible;opacity:1;transform:rotate(-8deg) scale(1);animation:stamp .5s cubic-bezier(.175,.885,.32,1.275)}@keyframes stamp{0%{transform:rotate(-8deg) scale(2.2)}65%{transform:rotate(-8deg) scale(.9)}100%{transform:rotate(-8deg) scale(1)}}.text{font-size:46px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;line-height:1}.sub{font-size:19px;font-weight:700;margin-top:5px;opacity:.9}
  </style>
</head>
<body>
  <div class="sold-out" id="soldOut" aria-live="polite"><div class="text">Sold Out</div><div class="sub">Vendu · Jeex na</div></div>
  <script>
    const soldOut=document.getElementById('soldOut');
    function receipt(message){const result=message.result||message,proposal=result.proposal||{},tool=proposal.tool==='studio.mark_sold_out_overlay'?'mark_sold_out':proposal.tool==='studio.switch_product'?'switch_product':proposal.tool,allowed=result.allowed??result.decision==='allow';if(!allowed)return;if(tool==='mark_sold_out')soldOut.classList.add('visible');if(tool==='switch_product')soldOut.classList.remove('visible')}
    function connect(){const scheme=location.protocol==='https:'?'wss':'ws',socket=new WebSocket(`${scheme}://${location.host}/ws`);socket.onmessage=(event)=>{try{const message=JSON.parse(event.data);if(message.type==='governed_action')receipt(message)}catch{}};socket.onclose=()=>setTimeout(connect,2000)}connect();
  </script>
</body>
</html>
