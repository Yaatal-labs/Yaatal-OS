[package]
name = "yaatal-os-shell"
version = "0.1.0"
description = "Yaatal OS Windows POC shell"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.5.1", features = [] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
