[package]
name = "kairmel-shell"
version = "0.1.0"
description = "Thin Tauri 2 desktop shell that hosts the Kairmel web app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kairmel_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "kairmel-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
url = "2"
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"

[dev-dependencies]
