[package]
name = "kairmel-shell"
version = "0.1.0"
description = "Thin Tauri 2 desktop shell that hosts the Kairmel web app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kairmel_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "kairmel-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
url = "2"

[dev-dependencies]
