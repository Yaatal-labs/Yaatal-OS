<!DOCTYPE html>
<html lang="wo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaatal Price Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        .price-card {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: #1a1a1a;
            padding: 16px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            text-align: center;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .price-card .label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .price-card .price {
            font-size: 36px;
            font-weight: 800;
            line-height: 1.1;
        }

        .price-card .currency {
            font-size: 18px;
            font-weight: 600;
            opacity: 0.9;
        }

        /* Flash animation when price updates */
        .price-card.flash {
            animation: slideIn 0.4s ease-out, flash 0.6s ease-in-out;
        }

        @keyframes flash {
            0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
            50% { box-shadow: 0 0 30px rgba(244, 208, 63, 0.8), 0 4px 20px rgba(0,0,0,0.4); }
        }
    </style>
</head>
<body>
    <div class="price-card" id="priceCard">
        <div class="label"> prix / njëg</div>
        <div class="price" id="priceText">12,000</div>
        <div class="currency" id="priceCurrency">FCFA</div>
    </div>

    <script>
        // Yaatal Live — Price Card Browser Source
        // Listens for price updates via URL parameters or postMessage.
        // OBS Browser Source can be refreshed with new URL params, or
        // the MCP server can use postMessage via obs-websocket browser source.

        function updatePrice(price, currency = 'FCFA') {
            const card = document.getElementById('priceCard');
            const priceText = document.getElementById('priceText');
            const priceCurrency = document.getElementById('priceCurrency');

            // Parse price — split number from currency if combined
            const parts = price.split(' ');
            if (parts.length > 1) {
                priceText.textContent = parts[0];
                priceCurrency.textContent = parts.slice(1).join(' ');
            } else {
                priceText.textContent = price;
                priceCurrency.textContent = currency;
            }

            // Flash animation
            card.classList.remove('flash');
            void card.offsetWidth; // trigger reflow
            card.classList.add('flash');
        }

        // Listen for postMessage from OBS browser source custom events
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'updatePrice') {
                updatePrice(event.data.price, event.data.currency);
            }
        });

        // Check URL params on load (for initial price)
        const params = new URLSearchParams(window.location.search);
        const initialPrice = params.get('price');
        if (initialPrice) {
            updatePrice(initialPrice, params.get('currency') || 'FCFA');
        }
    </script>
</body>
</html>
