<!DOCTYPE html>
<html lang="wo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaatal QR Overlay</title>
    <!-- QR code library (client-side, no server needed) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .qr-container {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .qr-container canvas, .qr-container img {
            display: block;
            margin: 0 auto 12px;
            border-radius: 8px;
        }

        .qr-label {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.3;
        }

        .qr-sublabel {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        .scan-hint {
            margin-top: 12px;
            font-size: 12px;
            color: #d4af37;
            font-weight: 600;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="qr-container" id="qrContainer">
        <div id="qrCode"></div>
        <div class="qr-label" id="qrLabel">Scanner pour acheter</div>
        <div class="qr-sublabel" id="qrSublabel"></div>
        <div class="scan-hint">📷 Ouvrez votre caméra</div>
    </div>

    <script>
        // Yaatal QR Overlay — Browser Source for OBS
        // Reads URL params to know what URL to encode and what label to show.
        // QR is rendered client-side — no server-side image generation needed.

        function getParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function renderQR(url, label) {
            const qrContainer = document.getElementById('qrCode');
            const labelEl = document.getElementById('qrLabel');
            const sublabelEl = document.getElementById('qrSublabel');

            // Generate QR code
            const qr = qrcode(0, 'M'); // type 0 = auto, error correction M
            qr.addData(url);
            qr.make();

            // Render as canvas (scalable)
            qrContainer.innerHTML = qr.createSvgTag({
                cellSize: 4,
                margin: 2,
                scalable: true,
            });

            // Or render as img (simpler, works everywhere)
            // qrContainer.innerHTML = qr.createImgTag(4);

            // Set label
            if (label) {
                labelEl.textContent = label;
            }

            // Show short URL as sublabel
            const shortUrl = url.replace(/^https?:\/\//, '').split('?')[0];
            sublabelEl.textContent = shortUrl;
        }

        // Listen for postMessage updates (from MCP controller)
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'updateQR') {
                renderQR(event.data.url, event.data.label);
            }
        });

        // Read URL params on load
        const url = getParam('url') || 'https://yaatal.shop';
        const label = getParam('label') || 'Scanner pour acheter';
        renderQR(url, label);
    </script>
</body>
</html>
